<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badini Store | سۆڕسا جیلبریک</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 30px;
            max-width: 400px;
            width: 100%;
        }
        .logo-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p {
            color: #8e8e93;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn-sileo {
            background-color: #007aff;
            color: #ffffff;
        }
        .btn-sileo:active {
            background-color: #005ec4;
            transform: scale(0.97);
        }
        .btn-cydia {
            background-color: #1c1c1e;
            color: #007aff;
            border: 1px solid rgba(0, 122, 255, 0.3);
        }
        .btn-cydia:active {
            background-color: #2c2c2e;
            transform: scale(0.97);
        }
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #48484a;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box">
            <img src="Cydialcon.png" alt="Badini Store Logo">
        </div>
        
        <h1>Badini Store</h1>
        <p>باشترین تویک و کڕکێن جیلبریکێ ل ڤێرە ب دەستخوە بخە. سۆرسێ ب کلیکەکێ زێدە بکە.</p>

        <div class="btn-group">
            <a href="sileo://source/https://badinistore.rf.gd" class="btn btn-sileo">
                زێدەکرن بۆ Sileo
            </a>

            <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://badinistore.rf.gd" class="btn btn-cydia">
                زێدەکرن بۆ Cydia
            </a>
        </div>

        <div class="footer">
            &copy; 2026 Badini Store. All Rights Reserved.
        </div>
    </div>

    <script>
        // کودی JS بۆ زانینا بارکرنا لاپەڕەی و چالاککرنا لینکێن دەرڤە
        console.log("Badini Store Web Loaded Successfully.");
    </script>

</body>
</html>
