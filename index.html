<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badini Store | سۆڕسێ جیلبریکێ</title>
    <style>
        @font-face {
            font-family: 'Rudaw';
            src: url('https://foloiq.rf.gd/font/rudaw.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rudaw', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0c 0%, #000000 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 35px 25px;
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin: 20px;
        }

        .logo-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.3s ease;
        }

        .logo-box:hover {
            transform: scale(1.05);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        p {
            color: #a1a1a6;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 15px 20px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
        }

        /* Sileo Button Style */
        .btn-sileo {
            background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
            color: #ffffff;
            border: 1px solid rgba(0, 122, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-sileo:hover {
            background: linear-gradient(135deg, #2c2c2e 0%, #3a3a3c 100%);
            border-color: rgba(0, 122, 255, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 122, 255, 0.25);
        }

        .btn-sileo:active {
            transform: scale(0.97);
        }

        /* Cydia Button Style */
        .btn-cydia {
            background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 149, 0, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-cydia:hover {
            background: linear-gradient(135deg, #2c2c2e 0%, #3a3a3c 100%);
            border-color: rgba(255, 149, 0, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 149, 0, 0.25);
        }

        .btn-cydia:active {
            transform: scale(0.97);
        }

        .repo-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 6px;
        }

        .social-box {
            margin-top: 15px;
        }

        .btn-telegram {
            background: rgba(28, 28, 30, 0.8);
            color: #2aabee;
            border: 1px solid rgba(42, 171, 238, 0.25);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-telegram:hover {
            background: rgba(42, 171, 238, 0.1);
            border-color: rgba(42, 171, 238, 0.5);
            transform: translateY(-2px);
        }

        .btn-telegram:active {
            transform: scale(0.97);
        }

        .btn-telegram svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #636366;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box">
            <img src="https://foloiq.rf.gd/icon.png" alt="Badini Store Logo">
        </div>
        
        <h1>Badini Store IPA</h1>
        <p>سورسەکێ کوردی ، درستکرن و ئامادەکرنا تویکا ل سەر ئایفونی بو sileo و cydia</p>

        <div class="btn-group">
            <a href="sileo://source/https://me8v4n.github.io/badinistoreipa/" class="btn btn-sileo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fb/Icon_Sileo.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail_unscaled" alt="Sileo" class="repo-icon">
‎                زێدەکرن بۆ Sileo
            </a>

            <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://me8v4n.github.io/badinistoreipa/" class="btn btn-cydia">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/8b/Cydia_logo.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Cydia" class="repo-icon">
‎                زێدەکرن بۆ Cydia
            </a>
        </div>

        <div class="social-box">
            <a href="https://t.me/badinistoreIPA" target="_blank" class="btn btn-telegram">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.42.53-.29-.01-.94-.18-1.4-.33-.56-.18-1.01-.28-.97-.59.02-.16.24-.32.66-.49 2.59-1.12 4.31-1.85 5.16-2.2 2.45-1.02 2.96-1.2 3.29-1.2.07 0 .24.02.35.11.09.08.12.19.13.27 0 .06.01.24 0 .37z"/>
                </svg>
‎                کەنالێ تێلێگرامی
            </a>
        </div>

        <div class="footer">
             2026 Badini Store
        </div>
    </div>

</body>
</html>
